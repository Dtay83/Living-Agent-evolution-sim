[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "living-agent-v2"
version = "2.0.0"
description = "Deterministic infodynamic simulation backend for Living Agent Evolution Sim"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "sympy>=1.13,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["living_agent_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

