[project]
name = "living-agent-evolution-v2"
version = "0.2.0"
description = "Living Agent Evolution Sim v2 backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sympy>=1.13",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

